name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kustomize
        uses: multani/action-setup-kustomize@v1
        with:
          version: 5.8.1

      - name: Validate frontend overlays
        run: |
          kustomize build --load-restrictor LoadRestrictionsNone apps/frontend/overlays/dev
          kustomize build --load-restrictor LoadRestrictionsNone apps/frontend/overlays/qa
          kustomize build --load-restrictor LoadRestrictionsNone apps/frontend/overlays/staging
          kustomize build --load-restrictor LoadRestrictionsNone apps/frontend/overlays/prod

      - name: Validate backend overlays
        run: |
          kustomize build --load-restrictor LoadRestrictionsNone apps/backend/overlays/dev
          kustomize build --load-restrictor LoadRestrictionsNone apps/backend/overlays/qa
          kustomize build --load-restrictor LoadRestrictionsNone apps/backend/overlays/staging
          kustomize build --load-restrictor LoadRestrictionsNone apps/backend/overlays/prod

      - name: Validate database overlays
        run: |
          kustomize build --load-restrictor LoadRestrictionsNone apps/database/overlays/dev
          kustomize build --load-restrictor LoadRestrictionsNone apps/database/overlays/qa
          kustomize build --load-restrictor LoadRestrictionsNone apps/database/overlays/staging
          kustomize build --load-restrictor LoadRestrictionsNone apps/database/overlays/prod
