apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa

resources:
  - ../../base
  - ../../secrets/backend-sealed-qa.yaml

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "test"
    target:
      kind: Deployment
      name: backend

images:
  - name: ghcr.io/emadrasooli/backend-api
    newTag: latest
