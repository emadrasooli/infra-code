apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
- ../../base

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: "development"
  target:
    kind: Deployment
    name: frontend

images:
- name: ghcr.io/emadrasooli/frontend-app
  newName: ghcr.io/emadrasooli/frontend-app
  newTag: v20260920-0721-3b17514
