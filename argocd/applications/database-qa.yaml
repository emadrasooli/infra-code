apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-qa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: qa
    app: database
spec:
  project: gitops-thesis
  source:
    repoURL: git@github.com:emadrasooli/infra-code.git
    targetRevision: main
    path: apps/database/overlays/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: qa
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
