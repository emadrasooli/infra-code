apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: "61.3.2"
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesInline:
      grafana:
        enabled: true
        adminPassword: "changeme"
      prometheus:
        enabled: true
      alertmanager:
        enabled: false
